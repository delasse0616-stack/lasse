<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<style>
  :root{
    --bg:#12141a; --board:#1e2129; --cell:#282c37; --text:#e8ebf0; --muted:#8b93a1; --accent:#f2b179;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:28px 16px;
  }
  .top{width:340px;max-width:92vw;display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
  h1{font-size:44px;font-weight:800;letter-spacing:-.02em}
  .scores{display:flex;gap:8px}
  .score{background:var(--board);border-radius:8px;padding:7px 14px;text-align:center;min-width:74px}
  .score .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .score .num{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .bar{width:340px;max-width:92vw;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .bar p{font-size:13px;color:var(--muted)}
  button{
    background:var(--accent);border:none;color:#1c1206;font-weight:700;font-size:13px;
    padding:9px 16px;border-radius:8px;cursor:pointer;transition:.15s;
  }
  button:hover{filter:brightness(1.08)}
  .board-wrap{position:relative;width:340px;height:340px;max-width:92vw;max-height:92vw}
  .board{
    position:absolute;inset:0;background:var(--board);border-radius:12px;padding:10px;
    display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px;
  }
  .board .bg{background:var(--cell);border-radius:8px}
  .tiles{position:absolute;inset:10px}
  .tile{
    position:absolute;width:calc((100% - 30px)/4);height:calc((100% - 30px)/4);
    display:flex;align-items:center;justify-content:center;border-radius:8px;
    font-weight:800;font-variant-numeric:tabular-nums;
    transition:transform .12s ease, opacity .12s ease;
    will-change:transform;
  }
  .tile.pop{animation:pop .16s ease}
  .tile.new{animation:appear .16s ease}
  @keyframes pop{0%{transform:scale(1) var(--pos)}50%{transform:scale(1.12) var(--pos)}100%{transform:scale(1) var(--pos)}}
  @keyframes appear{0%{opacity:0;transform:scale(.3) var(--pos)}100%{opacity:1;transform:scale(1) var(--pos)}}
  .overlay{
    position:absolute;inset:0;background:rgba(18,20,26,.86);border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    opacity:0;pointer-events:none;transition:.3s;z-index:5;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .overlay h2{font-size:34px}
  .hint{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
  kbd{background:var(--board);border-radius:4px;padding:1px 6px;font-family:inherit;font-size:11px}
</style>
</head>
<body>
  <div class="top">
    <h1>2048</h1>
    <div class="scores">
      <div class="score"><div class="lbl">Score</div><div class="num" id="score">0</div></div>
      <div class="score"><div class="lbl">Best</div><div class="num" id="best">0</div></div>
    </div>
  </div>

  <div class="bar">
    <p>같은 숫자를 합쳐 <b>2048</b>을 만드세요</p>
    <button id="newGame">새 게임</button>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <h2 id="overMsg">게임 오버</h2>
      <button id="retry">다시 하기</button>
    </div>
  </div>

  <p class="hint">
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 또는 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · 모바일은 스와이프
  </p>

<script>
(() => {
  const N = 4;
  const COLORS = {
    2:['#3a3f4b','#e8ebf0'], 4:['#46506a','#e8ebf0'], 8:['#f2b179','#1c1206'],
    16:['#f59563','#1c1206'], 32:['#f67c5f','#fff'], 64:['#f65e3b','#fff'],
    128:['#edcf72','#1c1206'], 256:['#edcc61','#1c1206'], 512:['#edc850','#1c1206'],
    1024:['#edc53f','#1c1206'], 2048:['#edc22e','#1c1206'], 4096:['#3c3a32','#fff']
  };
  const boardEl = document.getElementById('board');
  const tilesEl = document.getElementById('tiles');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overMsg = document.getElementById('overMsg');

  for (let i=0;i<N*N;i++){ const d=document.createElement('div'); d.className='bg'; boardEl.appendChild(d); }

  const safeGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
  const safeSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };

  let grid, score, best, won, over, uid;
  best = +(safeGet('best2048') || 0);
  bestEl.textContent = best;

  function init(){
    grid = Array.from({length:N}, () => Array(N).fill(null));
    score = 0; won = false; over = false; uid = 1;
    overlay.classList.remove('show');
    addRandom(); addRandom();
    render();
  }
  function addRandom(){
    const empty = [];
    for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (!grid[r][c]) empty.push([r,c]);
    if (!empty.length) return;
    const [r,c] = empty[Math.random()*empty.length|0];
    grid[r][c] = { id: uid++, val: Math.random()<0.9?2:4, r, c, isNew:true };
  }

  function pxPos(r,c){
    // cell size = (100% - 3*gap)/4 ; gap 10px
    return `translate(calc(${c} * (100% + 10px)), calc(${r} * (100% + 10px)))`;
  }
  function render(){
    scoreEl.textContent = score;
    tilesEl.innerHTML = '';
    for (let r=0;r<N;r++) for (let c=0;c<N;c++){
      const t = grid[r][c];
      if (!t) continue;
      const el = document.createElement('div');
      el.className = 'tile' + (t.isNew?' new':'') + (t.merged?' pop':'');
      const [bg,fg] = COLORS[t.val] || COLORS[4096];
      el.style.background = bg; el.style.color = fg;
      el.style.setProperty('--pos', pxPos(t.r, t.c));
      el.style.transform = pxPos(t.r, t.c);
      el.style.fontSize = t.val < 100 ? '30px' : t.val < 1000 ? '25px' : '20px';
      el.textContent = t.val;
      tilesEl.appendChild(el);
      t.isNew = false; t.merged = false;
    }
  }

  function move(dir){
    if (over) return;
    // dir: 0 up, 1 right, 2 down, 3 left
    let moved = false;
    const read = (line, i) => {
      if (dir===3) return grid[line][i];
      if (dir===1) return grid[line][N-1-i];
      if (dir===0) return grid[i][line];
      return grid[N-1-i][line];
    };
    const write = (line, i, val) => {
      if (dir===3) grid[line][i]=val;
      else if (dir===1) grid[line][N-1-i]=val;
      else if (dir===0) grid[i][line]=val;
      else grid[N-1-i][line]=val;
      if (val){
        if (dir===3){val.r=line;val.c=i;}
        else if (dir===1){val.r=line;val.c=N-1-i;}
        else if (dir===0){val.r=i;val.c=line;}
        else {val.r=N-1-i;val.c=line;}
      }
    };

    for (let line=0; line<N; line++){
      const cells = [];
      for (let i=0;i<N;i++){ const t = read(line,i); if (t) cells.push(t); }
      const result = [];
      for (let i=0;i<cells.length;i++){
        if (i+1 < cells.length && cells[i].val === cells[i+1].val){
          const merged = { id: cells[i].id, val: cells[i].val*2, merged:true };
          result.push(merged);
          score += merged.val;
          if (merged.val === 2048 && !won){ won = true; showWin(); }
          i++;
          moved = true;
        } else {
          result.push(cells[i]);
        }
      }
      for (let i=0;i<N;i++){
        const val = result[i] || null;
        const before = read(line,i);
        if ((before && !val) || (!before && val) || (before && val && before.id !== val.id)) moved = true;
        write(line, i, val);
      }
    }

    if (moved){
      addRandom();
      render();
      if (best < score){ best = score; bestEl.textContent = best; safeSet('best2048', best); }
      if (isStuck()){ over = true; overMsg.textContent = '게임 오버'; overlay.classList.add('show'); }
    }
  }

  function isStuck(){
    for (let r=0;r<N;r++) for (let c=0;c<N;c++){
      if (!grid[r][c]) return false;
      const v = grid[r][c].val;
      if (c+1<N && grid[r][c+1] && grid[r][c+1].val === v) return false;
      if (r+1<N && grid[r+1][c] && grid[r+1][c].val === v) return false;
    }
    return true;
  }
  function showWin(){
    overMsg.textContent = '2048 달성! 🎉';
    overlay.classList.add('show');
    setTimeout(() => { if (!over) overlay.classList.remove('show'); }, 1400);
  }

  const KEYMAP = {
    ArrowUp:0, ArrowRight:1, ArrowDown:2, ArrowLeft:3,
    KeyW:0, KeyD:1, KeyS:2, KeyA:3
  };
  window.addEventListener('keydown', e => {
    if (e.code in KEYMAP){ e.preventDefault(); move(KEYMAP[e.code]); }
  });

  // swipe
  let sx, sy;
  const wrap = document.querySelector('.board-wrap');
  wrap.addEventListener('touchstart', e => { const t=e.touches[0]; sx=t.clientX; sy=t.clientY; }, {passive:true});
  wrap.addEventListener('touchend', e => {
    if (sx==null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 3);
    else move(dy > 0 ? 2 : 0);
    sx = sy = null;
  }, {passive:true});

  document.getElementById('newGame').onclick = init;
  document.getElementById('retry').onclick = init;

  init();
})();
</script>
</body>
</html>
